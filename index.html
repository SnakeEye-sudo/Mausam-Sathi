<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="Mausam Sathi – Free weather app using Open-Meteo API (no API key needed)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mausam Sathi ⛅</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a1628;
    --surface: #0f2040;
    --surface2: #162b52;
    --border: rgba(147,197,253,0.15);
    --accent: #60a5fa;
    --accent2: #93c5fd;
    --sun: #fbbf24;
    --text: #dbeafe;
    --muted: #5580aa;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  [data-theme="light"] { --bg: #eff6ff; --surface: #fff; --surface2: #dbeafe; --text: #1e3a5f; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }

  /* LOCATION BAR */
  .loc-bar { padding: 12px 20px; display: flex; gap: 10px; }
  .loc-input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-family: var(--font); outline: none; transition: border-color 0.2s; }
  .loc-input:focus { border-color: var(--accent); }
  .loc-input::placeholder { color: var(--muted); }
  .loc-btn { padding: 12px 16px; border-radius: 14px; border: none; background: var(--accent); color: #0a1628; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font); white-space: nowrap; transition: all 0.2s; }
  .loc-btn:active { transform: scale(0.96); }
  .gps-btn { width: 46px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--accent); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }

  /* LOADING / ERROR */
  .state-message { text-align: center; padding: 60px 30px; }
  .state-icon { font-size: 56px; display: block; margin-bottom: 16px; }
  .state-text { font-size: 16px; color: var(--muted); line-height: 1.7; }
  .state-btn { margin-top: 20px; padding: 14px 28px; border-radius: 16px; border: none; background: var(--accent); color: #0a1628; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); }

  /* WEATHER CARD */
  .weather-section { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 14px; }

  .main-card {
    background: linear-gradient(135deg, rgba(15,32,64,0.9), rgba(22,43,82,0.8));
    border: 1.5px solid rgba(147,197,253,0.2);
    border-radius: 28px;
    padding: 28px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .weather-big-icon { font-size: 80px; margin-bottom: 8px; display: block; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4)); }
  .weather-temp { font-size: 64px; font-weight: 900; letter-spacing: -2px; }
  .weather-feels { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .weather-desc { font-size: 18px; font-weight: 700; color: var(--accent2); margin-top: 8px; }
  .weather-loc { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; }

  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .detail-icon { font-size: 22px; margin-bottom: 6px; }
  .detail-val { font-size: 20px; font-weight: 800; color: var(--accent2); }
  .detail-key { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* HOURLY */
  .hourly-scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 0 20px 4px; }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hourly-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 12px; text-align: center; flex-shrink: 0; min-width: 70px; }
  .hourly-time { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .hourly-icon { font-size: 22px; margin-bottom: 6px; display: block; }
  .hourly-temp { font-size: 15px; font-weight: 800; color: var(--accent2); }
  .hourly-rain { font-size: 10px; color: var(--accent); margin-top: 3px; }

  /* DAILY */
  .daily-list { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .daily-item { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  .daily-day { font-size: 14px; font-weight: 600; min-width: 65px; }
  .daily-icon { font-size: 22px; }
  .daily-desc { flex: 1; font-size: 12px; color: var(--muted); }
  .daily-temps { display: flex; gap: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .daily-max { color: var(--sun); }
  .daily-min { color: var(--accent2); }

  .section-header { padding: 16px 20px 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 20px; border-radius: 12px; cursor: pointer; border: none; background: none; color: var(--muted); font-family: var(--font); transition: all 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 600; }
  .nav-item svg { width: 22px; height: 22px; }
  .view { display: none; }
  .view.active { display: block; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <div class="topbar-brand">
    <span style="font-size:22px">⛅</span>
    <div>
      <div class="topbar-title">Mausam Sathi</div>
      <div class="topbar-sub" id="updateTime">Free • Open-Meteo API</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn">🌙</button>
</div>

<div class="main">

  <!-- WEATHER VIEW -->
  <div class="view active" id="view-weather">
    <div class="loc-bar">
      <input class="loc-input" id="locInput" type="text" placeholder="City name... (e.g. Delhi, Mumbai)">
      <button class="loc-btn" onclick="searchCity()">🔍 Search</button>
      <button class="gps-btn icon-btn" onclick="getGPS()" title="Use my location">📍</button>
    </div>

    <div id="weatherContent">
      <div class="state-message">
        <span class="state-icon">⛅</span>
        <div class="state-text">Apna shehar dhundho ya GPS use karo.<br>100% free – koi API key nahi chahiye!</div>
        <button class="state-btn" onclick="getGPS()">📍 Meri location use karo</button>
      </div>
    </div>
  </div>

  <!-- DETAILS VIEW -->
  <div class="view" id="view-details">
    <div id="detailContent" style="padding:20px;color:var(--muted);text-align:center">Pehle weather load karo.</div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="weather">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
    <span>Mausam</span>
  </button>
  <button class="nav-item" data-view="details">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Details</span>
  </button>
</nav>

<script>
// Weather code → emoji + description
const WC = {
  0:['☀️','Clear sky'], 1:['🌤️','Mostly clear'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Foggy'], 48:['🌫️','Freezing fog'],
  51:['🌦️','Light drizzle'], 53:['🌦️','Moderate drizzle'], 55:['🌧️','Dense drizzle'],
  61:['🌧️','Slight rain'], 63:['🌧️','Moderate rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Slight snow'], 73:['🌨️','Moderate snow'], 75:['❄️','Heavy snow'],
  77:['🌨️','Snow grains'],
  80:['🌦️','Slight showers'], 81:['🌧️','Moderate showers'], 82:['⛈️','Violent showers'],
  85:['🌨️','Snow showers'], 86:['❄️','Heavy snow showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm + hail'], 99:['⛈️','Heavy thunderstorm'],
};

let weatherData = null;
let locationName = '';

function wc(code) { return WC[code] || ['🌡️','Unknown']; }

async function getGPS() {
  showLoading();
  if (!navigator.geolocation) { showError('GPS support nahi hai is browser mein.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude, 'Meri Location'),
    err => { showError('Location access nahi mila. City name dalo upar.'); }
  );
}

async function searchCity() {
  const city = document.getElementById('locInput').value.trim();
  if (!city) return;
  showLoading();
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
    const d = await res.json();
    if (!d.results || !d.results.length) { showError('Shehar nahi mila. Dusra naam try karo.'); return; }
    const { latitude, longitude, name, admin1, country } = d.results[0];
    await fetchWeather(latitude, longitude, `${name}${admin1 ? ', ' + admin1 : ''}, ${country}`);
  } catch(e) { showError('Network error. Connection check karo.'); }
}

async function fetchWeather(lat, lon, locName) {
  locationName = locName;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,surface_pressure` +
      `&hourly=temperature_2m,weather_code,precipitation_probability` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset` +
      `&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    weatherData = await res.json();
    weatherData.locationName = locName;
    localStorage.setItem('mausam-last', JSON.stringify(weatherData));
    renderWeather();
    renderDetails();
    document.getElementById('updateTime').textContent = 'Updated: ' + new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
  } catch(e) { showError('Weather data nahi aaya. Thoda ruko aur try karo.'); }
}

function showLoading() {
  document.getElementById('weatherContent').innerHTML = `
    <div class="state-message">
      <span class="state-icon spin">⏳</span>
      <div class="state-text">Mausam fetch ho raha hai...</div>
    </div>`;
}

function showError(msg) {
  document.getElementById('weatherContent').innerHTML = `
    <div class="state-message">
      <span class="state-icon">⚠️</span>
      <div class="state-text">${msg}</div>
      <button class="state-btn" onclick="getGPS()">📍 GPS Try Karo</button>
    </div>`;
}

function renderWeather() {
  if (!weatherData) return;
  const c = weatherData.current;
  const [icon, desc] = wc(c.weather_code);
  const daily = weatherData.daily;
  const hourly = weatherData.hourly;
  const now = new Date();
  const nowHour = now.getHours();

  // Hourly (next 12 hours)
  const hourlyHTML = Array.from({ length: 12 }, (_, i) => {
    const hi = hourly.time.findIndex(t => new Date(t).getHours() >= nowHour) + i;
    if (hi >= hourly.time.length) return '';
    const [hIcon] = wc(hourly.weather_code[hi]);
    const time = new Date(hourly.time[hi]).toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit', hour12: true });
    return `
      <div class="hourly-card">
        <div class="hourly-time">${time}</div>
        <span class="hourly-icon">${hIcon}</span>
        <div class="hourly-temp">${Math.round(hourly.temperature_2m[hi])}°</div>
        ${hourly.precipitation_probability ? `<div class="hourly-rain">${hourly.precipitation_probability[hi] || 0}%🌧️</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('weatherContent').innerHTML = `
    <div class="weather-section">
      <div class="main-card">
        <span class="weather-big-icon">${icon}</span>
        <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="weather-feels">Feels like ${Math.round(c.apparent_temperature)}°C</div>
        <div class="weather-desc">${desc}</div>
        <div class="weather-loc">📍 ${weatherData.locationName}</div>
      </div>
    </div>
    <div class="section-header">Agle 12 ghante</div>
    <div class="hourly-scroll">${hourlyHTML}</div>
    <div class="section-header">7 din ka forecast</div>
    <div class="daily-list">
      ${daily.time.map((t, i) => {
        const [dIcon, dDesc] = wc(daily.weather_code[i]);
        const dayName = i === 0 ? 'Aaj' : i === 1 ? 'Kal' : new Date(t).toLocaleDateString('hi-IN', { weekday: 'short' });
        return `
          <div class="daily-item">
            <div class="daily-day">${dayName}</div>
            <div class="daily-icon">${dIcon}</div>
            <div class="daily-desc">${dDesc}</div>
            <div class="daily-temps">
              <span class="daily-max">↑${Math.round(daily.temperature_2m_max[i])}°</span>
              <span class="daily-min">↓${Math.round(daily.temperature_2m_min[i])}°</span>
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
}

function renderDetails() {
  if (!weatherData) return;
  const c = weatherData.current;
  const daily = weatherData.daily;
  const sr = daily.sunrise?.[0] ? new Date(daily.sunrise[0]).toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' }) : '–';
  const ss = daily.sunset?.[0] ? new Date(daily.sunset[0]).toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' }) : '–';

  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="detail-grid">
        <div class="detail-card"><div class="detail-icon">💧</div><div class="detail-val">${c.relative_humidity_2m}%</div><div class="detail-key">Humidity</div></div>
        <div class="detail-card"><div class="detail-icon">💨</div><div class="detail-val">${Math.round(c.wind_speed_10m)} km/h</div><div class="detail-key">Wind Speed</div></div>
        <div class="detail-card"><div class="detail-icon">🌡️</div><div class="detail-val">${c.surface_pressure ? Math.round(c.surface_pressure) + ' hPa' : '–'}</div><div class="detail-key">Pressure</div></div>
        <div class="detail-card"><div class="detail-icon">🌧️</div><div class="detail-val">${c.precipitation || 0} mm</div><div class="detail-key">Precipitation</div></div>
        <div class="detail-card"><div class="detail-icon">🌅</div><div class="detail-val">${sr}</div><div class="detail-key">Sunrise</div></div>
        <div class="detail-card"><div class="detail-icon">🌇</div><div class="detail-val">${ss}</div><div class="detail-key">Sunset</div></div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px">
        <div style="font-size:14px;font-weight:700;margin-bottom:10px;color:var(--accent2)">🌍 Location Details</div>
        <div style="font-size:14px;color:var(--muted);line-height:1.8">
          📍 ${weatherData.locationName}<br>
          🌐 Lat: ${weatherData.latitude?.toFixed(3)}, Lon: ${weatherData.longitude?.toFixed(3)}<br>
          🕐 Timezone: ${weatherData.timezone || 'Auto'}
        </div>
      </div>
    </div>
  `;
}

// Load last saved data
try {
  const last = JSON.parse(localStorage.getItem('mausam-last') || 'null');
  if (last && last.current) { weatherData = last; renderWeather(); renderDetails(); document.getElementById('updateTime').textContent = 'Cached data'; }
} catch {}

document.getElementById('locInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchCity(); });

// NAV
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('view-' + item.dataset.view).classList.add('active');
  });
});

// THEME
const savedTheme = localStorage.getItem('mausam-theme') || 'dark';
document.body.dataset.theme = savedTheme;
document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeBtn').addEventListener('click', () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('mausam-theme', t);
});
</script>
</body>
</html>
